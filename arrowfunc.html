<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Function</title>
</head>
<body>
    <script>
        var add2= (a,b)=>{
            console.log(a+b);
        };
        add2(100,20);
    </script>
    <p>we do not need curly bracket for single function, we can write it in single line.</p>

</body>
</html>
